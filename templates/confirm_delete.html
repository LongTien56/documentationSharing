<!DOCTYPE html>
<html>
<head>
    <title>Confirm Deletion</title>
</head>
<body>
    <h1>Confirm Deletion</h1>
    <p>Are you sure you want to delete the document: <strong>{{ document[0] }}</strong>?</p>
    
    <form method="POST">
        <button type="submit" style="color: red;">Yes, Delete</button>
        <a href="/">Cancel</a>
    </form>
</body>
</html>
